<div class="sidebar" [class.collapsed]="sidebarCollapsed">
  <div class="sidebar-header">
    <img src="assets/logo.png" alt="MTS Plus Logo" class="sidebar-logo" />
    <button class="toggle-btn" (click)="toggleSidebar()">
      <i
        class="fas"
        [class.fa-angle-left]="!sidebarCollapsed"
        [class.fa-angle-right]="sidebarCollapsed"
      ></i>
    </button>
  </div>

  <ul class="sidebar-menu">
    <li *ngFor="let menu of menuProperties" class="menu-item">
      <button
        class="menu-btn"
        [class.active]="menu.active"
        (click)="toggleMenu(menu)"
      >
        <img [src]="menu.icon" alt="{{ menu.titre }}" class="menu-icon" />
        <span *ngIf="!sidebarCollapsed">{{ menu.titre }}</span>
        <i
          *ngIf="menu.sousMenu && menu.sousMenu.length > 0 && !sidebarCollapsed"
          class="fas"
          [class.fa-angle-down]="menu.active"
          [class.fa-angle-right]="!menu.active"
        ></i>
      </button>

      <div
        class="submenu"
        [class.show]="menu.active && menu.sousMenu && menu.sousMenu.length > 0"
      >
        <ul>
          <li *ngFor="let sousMenu of menu.sousMenu">
            <a
              class="submenu-link"
              [class.active]="sousMenu.active"
              (click)="navigate(menu)"
            >
              <img
                *ngIf="sousMenu.icon"
                [src]="sousMenu.icon"
                alt="{{ sousMenu.titre }}"
                class="menu-icon"
              />
              <span *ngIf="!sidebarCollapsed">{{ sousMenu.titre }}</span>
            </a>
          </li>
        </ul>
      </div>
    </li>
  </ul>
</div>
