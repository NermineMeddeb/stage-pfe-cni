<div class="nouveau-client-container">
    <h2>🆕 Nouveau Client</h2>
    <form [formGroup]="nouveauClientForm" (ngSubmit)="onSubmit()">
      <!-- Champ pour le nom -->
      <div class="form-group">
        <label for="nom">👤 Nom</label>
        <input
          type="text"
          id="nom"
          class="form-control"
          formControlName="nom"
          placeholder="Entrez le nom"
        />
        <small
          class="text-danger"
          *ngIf="
            nouveauClientForm.get('nom')?.invalid &&
            nouveauClientForm.get('nom')?.touched
          "
        >
          Le nom est requis.
        </small>
      </div>
  
      <!-- Champ pour le prénom -->
      <div class="form-group">
        <label for="prenom">👤 Prénom</label>
        <input
          type="text"
          id="prenom"
          class="form-control"
          formControlName="prenom"
          placeholder="Entrez le prénom"
        />
        <small
          class="text-danger"
          *ngIf="
            nouveauClientForm.get('prenom')?.invalid &&
            nouveauClientForm.get('prenom')?.touched
          "
        >
          Le prénom est requis.
        </small>
      </div>
  
      <!-- Champ pour l'email -->
      <div class="form-group">
        <label for="email">📧 Email</label>
        <input
          type="email"
          id="email"
          class="form-control"
          formControlName="email"
          placeholder="Entrez l'email"
        />
        <small
          class="text-danger"
          *ngIf="
            nouveauClientForm.get('email')?.invalid &&
            nouveauClientForm.get('email')?.touched
          "
        >
          L'email est requis et doit être valide.
        </small>
      </div>
  
      <!-- Champ pour le téléphone -->
      <div class="form-group">
        <label for="telephone">📞 Téléphone</label>
        <input
          type="text"
          id="telephone"
          class="form-control"
          formControlName="telephone"
          placeholder="Entrez le téléphone"
        />
        <small
          class="text-danger"
          *ngIf="
            nouveauClientForm.get('telephone')?.invalid &&
            nouveauClientForm.get('telephone')?.touched
          "
        >
          Le téléphone doit contenir 10 chiffres.
        </small>
      </div>
  
      <!-- Champ pour le mot de passe -->
      <div class="form-group">
        <label for="motDePasse">🔒 Mot de passe</label>
        <input
          type="password"
          id="motDePasse"
          class="form-control"
          formControlName="motDePasse"
          placeholder="Entrez le mot de passe"
        />
        <small
          class="text-danger"
          *ngIf="
            nouveauClientForm.get('motDePasse')?.invalid &&
            nouveauClientForm.get('motDePasse')?.touched
          "
        >
          Le mot de passe est requis.
        </small>
      </div>
  
      <!-- Champ pour la photo -->
      <div class="form-group">
        <label for="photo">📷 Photo (URL)</label>
        <input
          type="text"
          id="photo"
          class="form-control"
          formControlName="photo"
          placeholder="Entrez l'URL de la photo"
        />
      </div>
  
      <!-- Champ pour l'adresse -->
      <div class="form-group">
        <label for="adresse">🏠 Adresse</label>
        <input
          type="text"
          id="adresse"
          class="form-control"
          formControlName="adresse"
          placeholder="Entrez l'adresse"
        />
      </div>
  
      <!-- Champ pour la date de naissance -->
      <div class="form-group">
        <label for="dateNaissance">🎂 Date de naissance</label>
        <input
          type="date"
          id="dateNaissance"
          class="form-control"
          formControlName="dateNaissance"
        />
      </div>
  
      <!-- Champ pour les rôles -->
      <div class="form-group">
        <label for="roles">🛡️ Rôles</label>
        <select
          id="roles"
          class="form-control"
          formControlName="roles"
          multiple
        >
        </select>
        
      </div>
  
      <!-- Boutons d'action -->
      <div class="form-group">
        <button
          type="submit"
          class="btn btn-primary"
          [disabled]="nouveauClientForm.invalid"
        >
          💾 Enregistrer
        </button>
        <button type="button" class="btn btn-secondary" (click)="onCancel()">
          ❌ Annuler
        </button>
      </div>
    </form>
  </div>
